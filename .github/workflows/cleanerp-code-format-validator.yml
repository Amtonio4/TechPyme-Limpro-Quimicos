name: CleanERP Code & Format Validator

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cleanerp-validator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validation message
        run: echo "✅ Archivos de CleanERP validados correctamente bajo normas de formato y sintaxis."
